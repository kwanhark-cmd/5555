# 자동 검사·빌드·배포
# - 커밋마다: 금고 호환 테스트 → 테스트 → 리눅스·안드로이드·윈도우·맥 빌드
# - 버전 태그(v1.2.3)를 올리면: 위 과정 + GitHub Releases 에 설치 파일·해시(SHA-256)·한국어 변경 내역
name: 검사와 빌드

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'pubspec 버전으로 태그를 만들고 Releases 에 올리기'
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: 테스트·린트·리눅스 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 리눅스 빌드 도구 설치
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - run: flutter pub get
      - name: ★ 금고 호환 테스트(이전 버전 금고를 같은 비밀번호로 열기) — 실패하면 중단
        run: flutter test test/compat
      - name: 형식 검사
        run: dart format --output=none --set-exit-if-changed lib test
      - name: 린트
        run: flutter analyze
      - name: 테스트(암호화 왕복·잘못된 비밀번호·흐름·디자인)
        run: flutter test
      - name: 앱 버전 읽기
        id: ver
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')" >> "$GITHUB_OUTPUT"
      - name: 태그와 앱 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v${{ steps.ver.outputs.version }}" = "${GITHUB_REF_NAME}"
      - name: 리눅스 앱 빌드
        run: flutter build linux --release
      - name: 리눅스 묶기
        run: tar -czf account_vault-${{ steps.ver.outputs.version }}-linux.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: account_vault-${{ steps.ver.outputs.version }}-linux.tar.gz

  android:
    name: 안드로이드 APK
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # 서명 키는 쓰지 않는다(주인 결정). 안드로이드 새 버전은 "백업 → 기존 앱 삭제 → 설치 → 복원" 방식.
      - name: APK 빌드(한 번 실패하면 한 번 더)
        run: |
          flutter build apk --release || { echo "APK 빌드 실패 — 30초 뒤 한 번 더 시도"; sleep 30; flutter build apk --release; }
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "account_vault-$v-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: account_vault-*-android.apk

  windows:
    name: 윈도우 앱·설치 파일
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: local_auth 우회 설정(MSVC 정의)이 남아 있는지 확인
        shell: pwsh
        run: |
          if (-not (Select-String -Path windows/CMakeLists.txt -Pattern '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' -Quiet)) { throw 'MSVC 우회 정의가 빠졌습니다' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: 설치 파일 만들기(Inno Setup)
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" windows\installer\account_vault.iss
          if ($LASTEXITCODE -ne 0) { throw '설치 파일 만들기 실패' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: build/installer/*.exe

  macos:
    name: 맥 앱
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: 앱 묶기
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          cd build/macos/Build/Products/Release
          ditto -c -k --keepParent account_vault.app "$GITHUB_WORKSPACE/account_vault-$v-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: account_vault-*-macos.zip

  release:
    name: GitHub Releases 에 올리기
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [test, android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 파일 모으기·해시 계산·변경 내역 만들기
        run: |
          v="${{ needs.test.outputs.version }}"
          mkdir dist
          find artifacts -type f \( -name '*.apk' -o -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS.txt)
          {
            # ★ 맨 위에 안드로이드 순서(백업 먼저). 이미 설치된 앱의 "업데이트 확인"은 이 글의 윗부분을 보여 준다.
            echo "### 안드로이드: 앱을 삭제하기 전에 꼭 백업 파일부터"
            echo "안드로이드는 앱을 삭제하면 금고(구독·계정·비밀번호)도 함께 지워집니다. 아래 순서를 꼭 지켜 주세요."
            echo "1. 지금 앱에서 설정 → 백업 → \"백업 파일 만들기\"를 누르고, 드라이브·내 파일·컴퓨터 등 **앱 밖에 저장**합니다."
            echo "2. 저장한 곳(드라이브·내 파일·컴퓨터)을 열어 \`금고백업-날짜.vaultbackup\` 파일이 있고 크기가 0 이 아닌지 확인합니다. 이 버전부터는 설정 → 백업 → \"저장한 백업 파일 확인\"으로도 확인할 수 있습니다. 마스터 비밀번호도 꼭 기억해 두세요."
            echo "3. 이 페이지에서 \`account_vault-$v-android.apk\` 를 내려받습니다."
            echo "4. 그다음에 기존 앱을 삭제합니다."
            echo "5. 내려받은 APK 를 눌러 설치합니다."
            echo "6. 새 앱 첫 화면에서 \"쓰던 금고가 있어요 — 백업 파일로 복원\"을 누르고 백업 파일을 고른 뒤, 백업을 만들 때의 마스터 비밀번호로 엽니다."
            echo "- 1.1.0 앱 안의 \"백업하고 내려받아 설치\" 버튼은 안드로이드에서 쓰지 마세요(그 자동 백업은 앱 안에 있어 앱을 삭제하면 함께 지워집니다)."
            echo
            echo "### 윈도우·맥·리눅스"
            echo "- 새 파일을 받아 설치하거나 바꾸면 됩니다. 금고는 사용자 자료 폴더에 그대로 남고, 같은 마스터 비밀번호로 열립니다."
            echo "- 복구 코드가 종이에 적혀 있는지 먼저 확인하세요."
            echo
            awk -v ver="## [$v]" 'index($0, ver)==1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md
            echo
            echo "### 파일 확인값(SHA-256)"
            echo "| 파일 | SHA-256 |"
            echo "|---|---|"
            while read -r h f; do echo "| $f | \`$h\` |"; done < dist/SHA256SUMS.txt
          } > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 구독·계정 비서 v${{ needs.test.outputs.version }}
          body_path: notes.md
          files: dist/*
